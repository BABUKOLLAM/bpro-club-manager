# Every push and pull request runs the workflow tests on a clean machine, so a failing tree cannot reach production quietly.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q tests -p no:cacheprovider
      - name: Every UI string exists in both languages
        run: |
          node -e "global.window={};require('./app/static/i18n.js');const en=Object.keys(window.I18N.en),ml=Object.keys(window.I18N.ml);const miss=en.filter(k=>!(k in window.I18N.ml)).concat(ml.filter(k=>!(k in window.I18N.en)));if(miss.length){console.error('missing:',miss);process.exit(1)}console.log(en.length,'keys in both languages')"
          for f in app/static/*.js; do node --check "$f"; done
      - name: Nothing that looks like a secret is committed
        run: |
          if git grep -nIE '(EAA[A-Za-z0-9]{40,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.md'; then
            echo "::error::a key or certificate appears to be committed"; exit 1
          fi

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Clubs · platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif;background:#F7F4EC;color:#1D2A28;margin:0;padding:24px;line-height:1.5}h1{color:#0F4C45;margin:0 0 4px}.m{color:#5B6B68;font-size:.9rem}
.card{background:#fff;border:1px solid #E3DED2;border-radius:14px;padding:16px 18px;margin:14px 0;max-width:980px}label{display:block;font-size:.85rem;color:#5B6B68;margin-top:8px}input,select{width:100%;padding:8px 10px;border:1px solid #E3DED2;border-radius:9px;font:inherit;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}.btn{background:#0F4C45;color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}.btn.g{background:#fff;color:#0F4C45;border:1px solid #E3DED2}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:8px;border-bottom:1px solid #E3DED2;text-align:left;vertical-align:top}th{font-size:.75rem;color:#5B6B68;text-transform:uppercase}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:600;background:#EEF2EF}.pill.ok{background:#E4F3EA;color:#2E7D4F}.pill.off{background:#FBE4E2;color:#B3261E}#msg{color:#B3261E;margin-top:8px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0 14px}.tile{background:#F7F4EC;border-radius:10px;padding:8px 10px}.tile b{display:block;font-size:1.25rem}.tile span{font-size:.78rem;color:#5B6B68}.tile.ok{background:#E4F3EA}.tile.w{background:#FBF0D9}.tile.bad{background:#FBE4E2}.pill.w{background:#FBF0D9;color:#A86A00}
</style></head>
<body><h1>Clubs on this server</h1><div class="m">Each club has its own database, uploads and backups, and is reached by its own domain. Point the domain's DNS at this server and add it below; Caddy obtains the certificate on first visit (on-demand TLS).</div>
<div class="card"><label>Master key (CLUB_MASTER_KEY)</label><input id="key" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')load()"><button class="btn" onclick="load()">Open</button><div id="msg"></div></div>
<div id="billing"></div>
<div id="list"></div>
<div class="card" id="create" style="display:none"><h2>Add a club</h2><div class="grid"><div><label>Slug (short id, e.g. kottayam-asc)</label><input id="slug"></div><div><label>Short name / number prefix</label><input id="short" placeholder="KASC"></div><div><label>Club name (English)</label><input id="name_en"></div><div><label>Club name (Malayalam)</label><input id="name_ml"></div>
<div><label>Domains (comma separated)</label><input id="domains" placeholder="kasc.clubs.example.org, kottayamclub.in"></div><div><label>Administrator login (e-mail or phone)</label><input id="admin_login"></div><div><label>Administrator password (8+)</label><input id="admin_password" type="text"></div></div><button class="btn" onclick="create()">Create club</button></div>
<div class="card" id="settings" style="display:none"><h2>Routing</h2><div class="grid"><div><label>Domains of the original (default) club</label><input id="default_domains"></div><div><label>Unknown host names</label><select id="strict"><option value="0">show the default club</option><option value="1">answer "no club at this address"</option></select></div>
<div><label>Product name (your white-label brand, shown on this page and on /signup, /pricing)</label><input id="product_name" placeholder="ClubPro"></div><div><label>Footer credit for new clubs ("Powered by …")</label><input id="powered_by" placeholder="Powered by Team Bpro"></div></div>
<h2 style="margin-top:18px">Pricing</h2><div class="grid"><div><label>Flat price up to N members (N)</label><input id="p_flat_upto" type="number" min="0"></div><div><label>Flat price per year (₹)</label><input id="p_flat_price" type="number" min="0"></div><div><label>Per member per year above N (₹)</label><input id="p_per_member" type="number" min="0"></div>
<div><label>Free trial (days)</label><input id="p_trial_days" type="number" min="0"></div><div><label>Grace after expiry (days)</label><input id="p_grace_days" type="number" min="0"></div><div><label>Your UPI ID for manual payment</label><input id="p_upi_id" placeholder="teambpro@upi"></div><div><label>UPI payee name</label><input id="p_upi_name"></div><div><label>Support contact (shown to clubs)</label><input id="p_support" placeholder="WhatsApp 98470 00000"></div></div>
<p class="m" id="gw"></p><button class="btn g" onclick="saveSettings()">Save routing</button><div class="m" id="base"></div></div>
<script>
const H = () => ({ 'X-Master-Key': document.getElementById('key').value, 'Content-Type': 'application/json' });
async function call(method, url, body) { const r = await fetch(url, { method, headers: H(), body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function load() { document.getElementById('msg').textContent = ''; try { const d = await call('GET', '/api/_platform/tenants'); sessionStorage.setItem('mk', document.getElementById('key').value);
  document.getElementById('list').innerHTML = `<div class="card"><table><tr><th>Slug</th><th>Club</th><th>Domains</th><th>Members</th><th>Applications</th><th>Last backup</th><th></th></tr>${d.tenants.map(t => `<tr><td><b>${esc(t.slug)}</b></td><td>${esc(t.club_name_en || t.name)} <span class="pill">${esc(t.club_short || '')}</span> ${t.active === false ? '<span class="pill off">off</span>' : '<span class="pill ok">active</span>'}</td><td>${(t.domains || []).map(x => `<a href="https://${esc(x)}" target="_blank">${esc(x)}</a>`).join('<br>') || '-'}</td><td>${t.members ?? '-'}</td><td>${t.applications ?? '-'}</td><td>${t.last_backup ? (b => esc(new Date(b.at * 1000).toLocaleString() + (b.error ? ' · failed: ' + b.error : b.drive ? ' · Drive' : '')))(JSON.parse(t.last_backup)) : '-'}</td><td>${t.slug !== 'default' ? `<button class="btn g" style="margin:0" onclick="editDomains('${esc(t.slug)}','${esc((t.domains || []).join(', '))}')">Domains</button> <button class="btn g" style="margin:0" onclick="toggle('${esc(t.slug)}',${t.active === false})">${t.active === false ? 'Activate' : 'Deactivate'}</button>` : ''}</td></tr>`).join('')}</table></div>`;
  await loadBilling();
  document.getElementById('create').style.display = ''; document.getElementById('settings').style.display = ''; document.getElementById('strict').value = d.strict ? '1' : '0'; document.getElementById('product_name').value = d.product_name || ''; document.getElementById('powered_by').value = d.powered_by || ''; if (d.product_name) { document.title = d.product_name + ' · clubs'; document.querySelector('h1').textContent = 'Clubs on ' + d.product_name; } const def = d.tenants.find(t => t.slug === 'default'); document.getElementById('default_domains').value = (def && def.domains || []).join(', '); document.getElementById('base').textContent = d.base_domain ? `CLUB_BASE_DOMAIN=${d.base_domain}: any club is also reachable at <slug>.${d.base_domain}` : '';
} catch (e) { document.getElementById('msg').textContent = e.message; } }
async function create() { try { const b = {}; ['slug', 'short', 'name_en', 'name_ml', 'admin_login', 'admin_password'].forEach(k => b[k] = document.getElementById(k).value.trim()); b.domains = document.getElementById('domains').value.split(',').map(x => x.trim()).filter(Boolean); await call('POST', '/api/_platform/tenants', b); alert('Club created. Sign in at its domain with the administrator login.'); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
async function editDomains(slug, cur) { const v = prompt('Domains, comma separated', cur); if (v === null) return; try { await call('POST', '/api/_platform/tenants/' + slug, { domains: v.split(',').map(x => x.trim()).filter(Boolean) }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
async function toggle(slug, on) { if (!confirm((on ? 'Activate ' : 'Deactivate ') + slug + '?')) return; try { await call('POST', '/api/_platform/tenants/' + slug, { active: on }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
async function saveSettings() { try { await call('POST', '/api/_platform/settings', { pricing: Object.fromEntries(['flat_upto', 'flat_price', 'per_member', 'trial_days', 'grace_days', 'upi_id', 'upi_name', 'support'].map(k => [k, document.getElementById('p_' + k).value])), product_name: document.getElementById('product_name').value, powered_by: document.getElementById('powered_by').value, strict: document.getElementById('strict').value === '1', default_domains: document.getElementById('default_domains').value.split(',').map(x => x.trim()).filter(Boolean) }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
const day = ts => ts ? new Date(ts * 1000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
async function loadBilling() {
  const b = await call('GET', '/api/_platform/billing'); const s = b.summary, by = s.by_status;
  ['flat_upto', 'flat_price', 'per_member', 'trial_days', 'grace_days', 'upi_id', 'upi_name', 'support'].forEach(k => document.getElementById('p_' + k).value = s.pricing[k] ?? '');
  document.getElementById('gw').textContent = s.gateway ? 'Online payment: your Razorpay account (CLUBPRO_RZP_*) is configured.' : 'Online payment: set CLUBPRO_RZP_KEY_ID / CLUBPRO_RZP_KEY_SECRET (and CLUBPRO_RZP_WEBHOOK_SECRET, webhook URL /api/saas/webhook) in .env to let clubs pay by card / UPI inside the app. Until then clubs pay to your UPI ID and send the reference.';
  const tile = (n, l, c) => `<div class="tile ${c || ''}"><b>${n}</b><span>${l}</span></div>`;
  const rows = b.rows.filter(r => r.status !== 'x');
  document.getElementById('billing').innerHTML = `<div class="card"><h2>Subscriptions · ${esc(s.product.name)}</h2><div class="tiles">${tile(s.clubs, 'paying clubs')}${tile(by.trial || 0, 'on trial', 'w')}${tile(by.active || 0, 'active', 'ok')}${tile(by.overdue || 0, 'payment due', 'w')}${tile(by.suspended || 0, 'read-only', 'bad')}${tile(money(s.arr), 'yearly run-rate')}${tile(money(s.paid_total), 'collected so far')}${tile(s.claims, 'UPI claims to confirm', s.claims ? 'w' : '')}</div>
  ${rows.length ? `<table><tr><th>Club</th><th>Status</th><th>Ends</th><th>Members</th><th>Price / yr</th><th>Contact</th><th>Payments</th><th></th></tr>${rows.map(r => `<tr><td><b>${esc(r.slug)}</b></td><td><span class="pill ${{ trial: 'w', active: 'ok', overdue: 'w', suspended: 'off' }[r.status]}">${r.status}</span></td><td>${day(r.ends)}${r.days_left !== null ? ` <span class="m">(${r.days_left} d)</span>` : ''}</td><td>${r.members}</td><td>${money(r.price)}</td><td class="m">${esc(r.contact.name || '')}<br>${esc(r.contact.phone || '')} ${esc(r.contact.email || '')}</td><td>${r.payments}${r.last_payment ? `<br><span class="m">${day(r.last_payment.at)} · ${money(r.last_payment.amount)} · ${esc(r.last_payment.via)}</span>` : ''}${r.claims.map(c => `<br><span class="pill w">claim ${esc(c.ref)} · ${money(c.amount)}</span> <button class="btn g" style="margin:0;padding:3px 8px" onclick="planAct('${esc(r.slug)}','approve_claim',{ref:'${esc(c.ref)}'})">Confirm</button> <button class="btn g" style="margin:0;padding:3px 8px" onclick="planAct('${esc(r.slug)}','reject_claim',{ref:'${esc(c.ref)}'})">Reject</button>`).join('')}</td>
  <td><button class="btn g" style="margin:0" onclick="markPaid('${esc(r.slug)}',${r.price})">Mark paid</button> <button class="btn g" style="margin:0" onclick="extend('${esc(r.slug)}')">Extend trial</button> ${r.status === 'suspended' ? `<button class="btn g" style="margin:0" onclick="planAct('${esc(r.slug)}','reactivate',{})">Reopen</button>` : `<button class="btn g" style="margin:0" onclick="if(confirm('Make ${esc(r.slug)} read-only?'))planAct('${esc(r.slug)}','suspended',{})">Suspend</button>`}</td></tr>`).join('')}</table>` : '<p class="m">No clubs yet. Clubs sign up at /signup; you can also add one below.</p>'}
  <p class="m">Public pages: <a href="/pricing" target="_blank">/pricing</a> · <a href="/signup" target="_blank">/signup</a>. Reminders go to each club's office bearers 7 days before the end, when payment is due and when the club becomes read-only.</p></div>`;
}
async function planAct(slug, action, extra) { try { await call('POST', '/api/_platform/tenants/' + slug + '/plan', { action, ...extra }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
function markPaid(slug, price) { const amount = prompt('Amount received (₹)', price); if (amount === null) return; const ref = prompt('Reference (receipt no / UTR)', ''); if (ref === null) return; planAct(slug, 'mark_paid', { amount: Number(amount), ref, via: 'manual' }); }
function extend(slug) { const d = prompt('Extend the trial by how many days?', '30'); if (d === null) return; planAct(slug, 'extend_trial', { days: Number(d) }); }
const saved = sessionStorage.getItem('mk'); if (saved) { document.getElementById('key').value = saved; load(); }
</script></body></html>

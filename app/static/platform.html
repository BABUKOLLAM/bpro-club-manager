<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Clubs · platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,system-ui,sans-serif;background:#F7F4EC;color:#1D2A28;margin:0;padding:24px;line-height:1.5}h1{color:#0F4C45;margin:0 0 4px}.m{color:#5B6B68;font-size:.9rem}
.card{background:#fff;border:1px solid #E3DED2;border-radius:14px;padding:16px 18px;margin:14px 0;max-width:980px}label{display:block;font-size:.85rem;color:#5B6B68;margin-top:8px}input,select{width:100%;padding:8px 10px;border:1px solid #E3DED2;border-radius:9px;font:inherit;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}.btn{background:#0F4C45;color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}.btn.g{background:#fff;color:#0F4C45;border:1px solid #E3DED2}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:8px;border-bottom:1px solid #E3DED2;text-align:left;vertical-align:top}th{font-size:.75rem;color:#5B6B68;text-transform:uppercase}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:600;background:#EEF2EF}.pill.ok{background:#E4F3EA;color:#2E7D4F}.pill.off{background:#FBE4E2;color:#B3261E}#msg{color:#B3261E;margin-top:8px}</style></head>
<body><h1>Clubs on this server</h1><div class="m">Each club has its own database, uploads and backups, and is reached by its own domain. Point the domain's DNS at this server and add it below; Caddy obtains the certificate on first visit (on-demand TLS).</div>
<div class="card"><label>Master key (CLUB_MASTER_KEY)</label><input id="key" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')load()"><button class="btn" onclick="load()">Open</button><div id="msg"></div></div>
<div id="list"></div>
<div class="card" id="create" style="display:none"><h2>Add a club</h2><div class="grid"><div><label>Slug (short id, e.g. kottayam-asc)</label><input id="slug"></div><div><label>Short name / number prefix</label><input id="short" placeholder="KASC"></div><div><label>Club name (English)</label><input id="name_en"></div><div><label>Club name (Malayalam)</label><input id="name_ml"></div>
<div><label>Domains (comma separated)</label><input id="domains" placeholder="kasc.clubs.example.org, kottayamclub.in"></div><div><label>Administrator login (e-mail or phone)</label><input id="admin_login"></div><div><label>Administrator password (8+)</label><input id="admin_password" type="text"></div></div><button class="btn" onclick="create()">Create club</button></div>
<div class="card" id="settings" style="display:none"><h2>Routing</h2><div class="grid"><div><label>Domains of the original (default) club</label><input id="default_domains"></div><div><label>Unknown host names</label><select id="strict"><option value="0">show the default club</option><option value="1">answer "no club at this address"</option></select></div>
<div><label>Product name (your white-label brand, shown on this page)</label><input id="product_name" placeholder="ClubDesk"></div><div><label>Footer credit for new clubs ("Powered by …")</label><input id="powered_by" placeholder="Powered by ClubDesk · clubdesk.in"></div></div><button class="btn g" onclick="saveSettings()">Save routing</button><div class="m" id="base"></div></div>
<script>
const H = () => ({ 'X-Master-Key': document.getElementById('key').value, 'Content-Type': 'application/json' });
async function call(method, url, body) { const r = await fetch(url, { method, headers: H(), body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function load() { document.getElementById('msg').textContent = ''; try { const d = await call('GET', '/api/_platform/tenants'); sessionStorage.setItem('mk', document.getElementById('key').value);
  document.getElementById('list').innerHTML = `<div class="card"><table><tr><th>Slug</th><th>Club</th><th>Domains</th><th>Members</th><th>Applications</th><th>Last backup</th><th></th></tr>${d.tenants.map(t => `<tr><td><b>${esc(t.slug)}</b></td><td>${esc(t.club_name_en || t.name)} <span class="pill">${esc(t.club_short || '')}</span> ${t.active === false ? '<span class="pill off">off</span>' : '<span class="pill ok">active</span>'}</td><td>${(t.domains || []).map(x => `<a href="https://${esc(x)}" target="_blank">${esc(x)}</a>`).join('<br>') || '-'}</td><td>${t.members ?? '-'}</td><td>${t.applications ?? '-'}</td><td>${t.last_backup ? (b => esc(new Date(b.at * 1000).toLocaleString() + (b.error ? ' · failed: ' + b.error : b.drive ? ' · Drive' : '')))(JSON.parse(t.last_backup)) : '-'}</td><td>${t.slug !== 'default' ? `<button class="btn g" style="margin:0" onclick="editDomains('${esc(t.slug)}','${esc((t.domains || []).join(', '))}')">Domains</button> <button class="btn g" style="margin:0" onclick="toggle('${esc(t.slug)}',${t.active === false})">${t.active === false ? 'Activate' : 'Deactivate'}</button>` : ''}</td></tr>`).join('')}</table></div>`;
  document.getElementById('create').style.display = ''; document.getElementById('settings').style.display = ''; document.getElementById('strict').value = d.strict ? '1' : '0'; document.getElementById('product_name').value = d.product_name || ''; document.getElementById('powered_by').value = d.powered_by || ''; if (d.product_name) { document.title = d.product_name + ' · clubs'; document.querySelector('h1').textContent = 'Clubs on ' + d.product_name; } const def = d.tenants.find(t => t.slug === 'default'); document.getElementById('default_domains').value = (def && def.domains || []).join(', '); document.getElementById('base').textContent = d.base_domain ? `CLUB_BASE_DOMAIN=${d.base_domain}: any club is also reachable at <slug>.${d.base_domain}` : '';
} catch (e) { document.getElementById('msg').textContent = e.message; } }
async function create() { try { const b = {}; ['slug', 'short', 'name_en', 'name_ml', 'admin_login', 'admin_password'].forEach(k => b[k] = document.getElementById(k).value.trim()); b.domains = document.getElementById('domains').value.split(',').map(x => x.trim()).filter(Boolean); await call('POST', '/api/_platform/tenants', b); alert('Club created. Sign in at its domain with the administrator login.'); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
async function editDomains(slug, cur) { const v = prompt('Domains, comma separated', cur); if (v === null) return; try { await call('POST', '/api/_platform/tenants/' + slug, { domains: v.split(',').map(x => x.trim()).filter(Boolean) }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
async function toggle(slug, on) { if (!confirm((on ? 'Activate ' : 'Deactivate ') + slug + '?')) return; try { await call('POST', '/api/_platform/tenants/' + slug, { active: on }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
async function saveSettings() { try { await call('POST', '/api/_platform/settings', { product_name: document.getElementById('product_name').value, powered_by: document.getElementById('powered_by').value, strict: document.getElementById('strict').value === '1', default_domains: document.getElementById('default_domains').value.split(',').map(x => x.trim()).filter(Boolean) }); load(); } catch (e) { document.getElementById('msg').textContent = e.message; } }
const saved = sessionStorage.getItem('mk'); if (saved) { document.getElementById('key').value = saved; load(); }
</script></body></html>
